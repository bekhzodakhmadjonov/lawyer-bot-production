name: lawyer-bot-local

services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: lawyer-bot-production:latest
    container_name: lawyer_bot_local
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@postgres:5432/lawyer_bot
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./data:/app/data
    networks:
      - lawyer_bot_local_net
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health').raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  postgres:
    image: postgres:16-alpine
    container_name: lawyer_bot_postgres_local
    restart: unless-stopped
    environment:
      POSTGRES_DB: lawyer_bot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data_local:/var/lib/postgresql/data
    networks:
      - lawyer_bot_local_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lawyer_bot"]
      interval: 10s
      timeout: 5s
      retries: 5
    expose:
      - "5432"

volumes:
  postgres_data_local:
    driver: local

networks:
  lawyer_bot_local_net:
    driver: bridge